<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:title" content="与黑格尔夜谈">
<meta property="og:description" content="深夜书房里的一场对话游戏。用选择、排序和解锁概念卡，把黑格尔讲成人话。">

<title>与黑格尔夜谈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#c9a961; --gold2:#e6cf94; --dim:#8a7440;
  --ink:#07080b; --panel:rgba(17,21,27,.92);
  --text:#e8e0cc; --muted:#8d8778; --line:rgba(201,169,97,.22);
}
html,body{height:100%}
body{
  background:var(--ink); color:var(--text); overflow:hidden;
  font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  display:flex; justify-content:center;
}
#app{position:relative;width:100%;max-width:540px;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.bg{position:absolute;inset:0;background:
  radial-gradient(120% 60% at 50% 0%,#1d2530 0%,#0d1117 45%,#07080b 80%);}
.bg:after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(circle at 20% 30%,rgba(201,169,97,.06),transparent 40%),
                   radial-gradient(circle at 80% 70%,rgba(120,150,200,.05),transparent 45%);}

/* ---------- header ---------- */
header{position:relative;z-index:3;padding:calc(10px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:center;gap:10px}
.chip{font-size:11px;letter-spacing:.14em;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 9px;white-space:nowrap}
#chapter{font-size:11.5px;letter-spacing:.1em;color:#a89e88;flex:1;text-align:right;transition:opacity .3s}
.meter{position:relative;z-index:3;margin:0 18px;height:3px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a7440,var(--gold2));transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(201,169,97,.6)}

/* ---------- stage / portrait ---------- */
#stage{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 0}
#portrait{position:relative;width:min(56vh,310px);aspect-ratio:1;transition:opacity .5s,transform .6s,filter .5s;
  filter:drop-shadow(0 8px 40px rgba(0,0,0,.7));animation:breathe 7s ease-in-out infinite}
#portrait svg{width:100%;height:100%;display:block}
body[data-who="you"] #portrait{opacity:.55;transform:scale(.97) translateY(4px);filter:grayscale(.5) drop-shadow(0 8px 30px rgba(0,0,0,.7))}
body[data-who="narr"] #portrait{opacity:.55;filter:grayscale(.8) drop-shadow(0 8px 30px rgba(0,0,0,.7))}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.halo{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(201,169,97,.13),transparent 62%);pointer-events:none}

/* ---------- dialogue ---------- */
#dialogue{position:relative;z-index:3;padding:0 14px calc(12px + env(safe-area-inset-bottom));}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 14px 14px;
  padding:14px 16px 15px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 -10px 40px rgba(0,0,0,.55);position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,97,.5),transparent)}
#echo{font-size:12px;color:#7d7566;font-style:italic;margin-bottom:7px;opacity:0;transition:opacity .5s;line-height:1.5;
  border-left:2px solid rgba(201,169,97,.25);padding-left:8px}
#echo.on{opacity:1}
#nameplate{font-size:12.5px;letter-spacing:.22em;color:var(--gold);margin-bottom:7px;min-height:15px}
#nameplate.you{color:#7fa8c9}
#text{font-size:16.5px;line-height:1.82;letter-spacing:.02em;min-height:92px;max-height:34vh;overflow-y:auto;
  text-shadow:0 1px 0 rgba(0,0,0,.4)}
#text.narr{color:#b9b1a0;font-style:italic;font-size:15.5px}
#hint{text-align:right;font-size:12px;color:var(--dim);margin-top:6px;opacity:0;transition:opacity .4s;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:.85}}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:left;background:rgba(201,169,97,.05);border:1px solid rgba(201,169,97,.2);color:#ded5be;
  padding:11px 13px;border-radius:10px;font-family:inherit;font-size:14.5px;line-height:1.55;
  transition:.22s;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.opt span.n{color:var(--dim);font-size:11px;padding-top:3px;min-width:12px}
.opt:active,.opt:hover{background:rgba(201,169,97,.14);border-color:rgba(201,169,97,.5);transform:translateX(2px)}
.opt:disabled{opacity:.4}

/* ---------- order puzzle ---------- */
.slots{display:flex;gap:8px;margin-top:12px}
.slot{flex:1;height:64px;border:1px dashed rgba(201,169,97,.35);border-radius:10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;color:var(--text);
  cursor:pointer;transition:.25s;background:rgba(255,255,255,.02)}
.slot b{font-size:10px;color:var(--dim);font-weight:400;letter-spacing:.2em}
.slot.filled{border-style:solid;border-color:rgba(201,169,97,.7);background:rgba(201,169,97,.12);box-shadow:0 0 18px rgba(201,169,97,.15) inset}
.slot.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pool{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tile{flex:1;min-width:70px;padding:9px 6px;text-align:center;border-radius:9px;font-size:14.5px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#ddd4bd;cursor:pointer;transition:.2s}
.tile:active{transform:scale(.96)}
.tile.used{opacity:.25;pointer-events:none}
.tile small{display:block;font-size:10px;color:var(--muted);margin-top:2px}

/* ---------- hud / drawer ---------- */
#hud{position:absolute;right:14px;bottom:calc(100% + 0px);z-index:4;display:none}
#cardBtn{position:relative;z-index:6;background:rgba(20,24,30,.9);flex:0 0 auto;
  border:1px solid var(--line);color:var(--gold);border-radius:20px;padding:5px 11px;font-size:11.5px;
  font-family:inherit;letter-spacing:.08em;display:flex;align-items:center;gap:5px;cursor:pointer;backdrop-filter:blur(8px)}
#cardBtn b{font-size:10px;background:rgba(201,169,97,.18);border-radius:8px;padding:1px 5px;font-weight:400}
#cardBtn.pulse{animation:pulse .7s}
@keyframes pulse{0%,100%{transform:scale(1)}40%{transform:scale(1.16);box-shadow:0 0 22px rgba(201,169,97,.5)}}
#drawer{position:absolute;inset:0;z-index:10;background:rgba(6,7,10,.86);backdrop-filter:blur(14px);
  transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.85,.2,1);display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#drawer.on{transform:translateY(0)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer-h h3{font-size:15px;font-weight:400;letter-spacing:.2em;color:var(--gold)}
.drawer-h button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;
  padding:4px 12px;font-family:inherit;font-size:12px;cursor:pointer}
#cards{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.card{border:1px solid rgba(201,169,97,.18);border-radius:12px;padding:12px 14px;background:rgba(201,169,97,.04);
  animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h4{font-size:14.5px;color:var(--gold2);font-weight:400;letter-spacing:.06em;margin-bottom:6px}
.card h4 em{font-size:11px;color:var(--dim);font-style:normal;margin-left:6px;letter-spacing:.05em}
.card p{font-size:13.5px;line-height:1.75;color:#cfc7b4}
.card .eg{margin-top:7px;font-size:12.5px;color:#948c7c;border-left:2px solid rgba(201,169,97,.3);padding-left:9px;line-height:1.7}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0;line-height:1.9}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:32px 26px;transition:opacity .7s,visibility .7s}
.overlay.hide{opacity:0;visibility:hidden}
#title{background:radial-gradient(70% 50% at 50% 35%,#141a22,#07080b 75%)}
#title .orn{width:44px;height:1px;background:var(--dim);margin:18px auto}
#title h1{font-size:34px;font-weight:400;letter-spacing:.12em;color:#efe6cf;text-shadow:0 0 40px rgba(201,169,97,.35)}
#title h2{font-size:10.5px;letter-spacing:.2em;color:var(--dim);margin-top:14px;font-weight:400;white-space:nowrap}
#title p{font-size:13px;color:#8d8778;line-height:2;margin-top:26px;max-width:300px}
#title .sig{margin-top:8px;font-size:11.5px;color:#5f5a4e;letter-spacing:.1em}
.btn{margin-top:30px;background:linear-gradient(180deg,rgba(201,169,97,.16),rgba(201,169,97,.06));
  border:1px solid rgba(201,169,97,.55);color:var(--gold2);font-family:inherit;font-size:15px;
  letter-spacing:.3em;padding:13px 42px;border-radius:4px;cursor:pointer;transition:.3s}
.btn:active{transform:scale(.97);background:rgba(201,169,97,.25)}
#endScreen{background:radial-gradient(70% 50% at 50% 30%,#1a1610,#07080b 78%);overflow-y:auto;justify-content:flex-start;padding-top:calc(40px + env(safe-area-inset-top))}
#endScreen h2{font-size:24px;font-weight:400;letter-spacing:.14em;color:var(--gold2);margin-bottom:6px}
#endScreen .rank{font-size:12px;letter-spacing:.24em;color:var(--dim);margin-bottom:22px}
#endScreen .body{font-size:14.5px;line-height:2.1;color:#d3cab6;max-width:340px;text-align:left}
#endScreen .score{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:22px 0 6px}
#endScreen .cards-mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;max-width:340px}
.cm{font-size:11.5px;border:1px solid rgba(201,169,97,.25);color:#b8ae97;border-radius:20px;padding:3px 10px}
#endScreen .btn{margin-top:26px;font-size:13px;padding:11px 28px;letter-spacing:.2em}
#endScreen .fine{font-size:10.5px;color:#4f4b42;margin-top:22px;line-height:1.8;max-width:320px}
</style>
</head>

<script>
/* ================= 概念卡 ================= */
const CARDS = {
  bianzheng: {t:'辩证法', en:'Dialektik', p:'不是「吵架术」，而是事物自己待不住：任何规定一旦被说清楚，就暴露出它依赖的反面，于是被迫往前走一步。', eg:'你说「我就是自由的」——立刻要问：谁在限制你？没有限制，「自由」这个词就没有内容。'},
  zhengfanhe: {t:'正—反—合', en:'These / Antithese / Synthese', p:'它不是一个三步流程，而是一个动作的三个瞬间：立场出现、自我否定、在更高层面把两边都保留下来。第三个不是折中，是升级。', eg:'有 → 无 → 变。前两个各自空掉，第三个才第一次「言之有物」。'},
  maodun: {t:'矛盾', en:'Widerspruch', p:'在黑格尔那儿矛盾不是错误，而是动力。凡有限的东西都含着自我拆解的种子，正是这颗种子推着它变成别的东西。', eg:'一枝花开放的同时就在凋谢——同一件事，两个方向。'},
  yangqi: {t:'扬弃', en:'Aufhebung', p:'一个词同时干三件事：否定、保存、提高。旧形态被取消了，但它的真理没有被丢掉，而是被抬到更高一层。', eg:'学会骑车后你不再需要「想着平衡」（否定），但平衡感留下了（保存），你能骑得更远（提高）。'},
  chengren: {t:'承认', en:'Anerkennung', p:'自我意识不能独自成立。我要确认「我是谁」，必须有一个同样自由的存在看着我、承认我。自由因此不是独角戏。', eg:'一个人对着镜子练一百遍演讲，也不如在台下有一个人真正听懂。'},
  zhunu: {t:'主奴辩证法', en:'Herrschaft und Knechtschaft', p:'主人用生命冒险赢得统治，却从此依赖奴隶的承认；奴隶在劳动中把世界改造成自己的作品，在作品里认出了自己。历史的主动权在这里悄悄调头。', eg:'雇主离了员工什么也造不出；而员工带走的技艺，谁也拿不走。'},
  jiaoxia: {t:'理性的狡黠', en:'List der Vernunft', p:'历史不靠善意推动。人们追逐私利、激情与荣耀，理性躲在背后，借这些激情实现自己更大的目的。', eg:'无数人为赚钱修铁路，最后改变的是整个时代的时间感。'},
  juedui: {t:'绝对精神', en:'absoluter Geist', p:'不是「全知全能的上帝」，而是精神彻底认识了自己：我就是世界得以被理解的那个结构。它走三段路：艺术（形象）、宗教（表象）、哲学（概念）。', eg:'同一份悲伤，可以是首歌、一次祈祷，也可以是一句被说准的话。'},
  maozi: {t:'密涅瓦的猫头鹰', en:'Eule der Minerva', p:'智慧女神头上的猫头鹰黄昏才起飞。哲学总是来得太晚，它只能理解已经发生的事，不能预言未来。清醒是一种迟到。', eg:'你总是先经历完一段关系，才终于明白它是什么。'},

/* ================= 引擎 ================= */
const MAX = 54;
const S = {insight:0, cards:new Set(['bianzheng']), done:false};
const $ = s => document.querySelector(s);
const CN = ['一','二','三','四'];
let cur = null, timer = null, pendingNext = null, busyTyping = false;

/* ---- 打字机 ---- */
function typeText(el, text, speed, done){
  clearInterval(timer);
  busyTyping = true;
  el.textContent = '';
  let i = 0;
  timer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if(i >= text.length){ clearInterval(timer); busyTyping = false; done && done(); }
  }, speed || 20);
  el.dataset.full = text;
}
function finishTyping(){
  if(!busyTyping) return false;
  clearInterval(timer);
  $('#text').textContent = $('#text').dataset.full || '';
  busyTyping = false;
  afterTyping();
  return true;
}

/* ---- 概念卡 ---- */
function unlock(id){
  if(!id || S.cards.has(id)) return;
  S.cards.add(id);
  $('#cardCount').textContent = S.cards.size;
  const b = $('#cardBtn');
  b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
  renderCards();
}
function renderCards(){
  const box = $('#cards');
  if(!S.cards.size){ box.innerHTML = '<div class="empty">还没有任何概念卡。<br>和他聊聊，它们会自己出现。</div>'; return; }
  box.innerHTML = '';
  S.cards.forEach(id => {
    const c = CARDS[id]; if(!c) return;
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<h4>' + c.t + '<em>' + (c.en || '') + '</em></h4>' +
                  '<p>' + c.p + '</p>' + (c.eg ? '<div class="eg">' + c.eg + '</div>' : '');
    box.appendChild(d);
  });
}

/* ---- 进度条 ---- */
function updateBar(){
  $('#bar').style.width = Math.min(100, S.insight / MAX * 100) + '%';
}

/* ---- 节点渲染 ---- */
let afterTyping = () => {};

function go(id){
  if(id === 'end'){ endGame(); return; }
  const n = NODES[id];
  if(!n){ console.warn('missing node', id); return; }
  cur = n;
  $('#hint').style.opacity = 0;
  if(n.ch) $('#chapter').textContent = n.ch;
  if(n.card) unlock(n.card);
  if(n.insight){ S.insight += n.insight; updateBar(); }

  const who = n.who || 'hegel';
  document.body.dataset.who = who;
  const np = $('#nameplate');
  np.textContent = who === 'hegel' ? '黑格尔' : (who === 'you' ? '你' : '');
  np.className = who === 'you' ? 'you' : '';
  const tx = $('#text');
  tx.className = who === 'narr' ? 'narr' : '';
  $('#choices').innerHTML = '';
  pendingNext = n.next || null;

  if(n.type === 'end'){ endGame(); return; }

  afterTyping = () => {
    if(n.choices) renderChoices(n.choices);
    else if(n.type === 'order') renderOrder(n);
    else if(n.next) $('#hint').style.opacity = 1;
  };
  typeText(tx, n.text, who === 'narr' ? 24 : 19, afterTyping);
}

function renderChoices(list){
  const box = $('#choices');
  box.innerHTML = '';
  list.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="n">' + CN[i] + '</span><span>' + c.t + '</span>';
    b.onclick = (e) => {
      e.stopPropagation();
      box.innerHTML = '';
      $('#hint').style.opacity = 0;
      if(c.card) unlock(c.card);
      const e2 = $('#echo');
      e2.textContent = '你说：' + c.t;
      e2.classList.add('on');
      if(c.insight){ S.insight += c.insight; updateBar(); }
      go(c.next);
    };
    box.appendChild(b);
  });
}

/* ---- 排序谜题 ---- */
function renderOrder(n){
  const box = $('#choices');
  box.innerHTML = '';
  $('#hint').style.opacity = 0;
  let filled = [null, null, null];

  const slots = document.createElement('div');
  slots.className = 'slots';
  const pool = document.createElement('div');
  pool.className = 'pool';

  const tileMap = {};
  function draw(){
    slots.innerHTML = '';
    filled.forEach((v, i) => {
      const s = document.createElement('div');
      s.className = 'slot' + (v ? ' filled' : '');
      const item = v ? n.tiles.find(t => t.id === v) : null;
      s.innerHTML = '<b>' + n.slots[i] + '</b>' + (item ? '<span>' + item.label + '</span>' : '<span style="color:#5c574d;font-size:12px">待放</span>');
      s.onclick = (e) => {
        e.stopPropagation();
        if(!filled[i]) return;
        tileMap[filled[i]].classList.remove('used');
        filled[i] = null; draw();
      };
      slots.appendChild(s);
    });
    n.tiles.forEach(t => {
      if(!tileMap[t.id]){
        const d = document.createElement('div');
        d.className = 'tile';
        d.innerHTML = t.label + '<small>' + (t.sub || '') + '</small>';
        d.onclick = (e) => {
          e.stopPropagation();
          const idx = filled.indexOf(null);
          if(idx < 0) return;
          filled[idx] = t.id; d.classList.add('used'); draw();
          if(filled.every(x => x)) setTimeout(() => check(), 280);
        };
        tileMap[t.id] = d;
      }
      pool.appendChild(tileMap[t.id]);
    });
  }
  function check(){
    const ok = filled.every((v, i) => v === n.solution[i]);
    if(ok){
      slots.querySelectorAll('.slot').forEach(s => s.style.borderColor = 'rgba(230,207,148,.95)');
      setTimeout(() => { if(n.card) unlock(n.card); go(n.ok); }, 520);
    } else {
      slots.querySelectorAll('.slot').forEach(s => { s.classList.add('shake'); });
      const e2 = $('#echo');
      e2.textContent = '黑格尔：' + n.fail;
      e2.classList.add('on');
      setTimeout(() => {
        filled = [null, null, null];
        n.tiles.forEach(t => tileMap[t.id].classList.remove('used'));
        draw();
      }, 1500);
    }
  }
  draw();
  box.appendChild(slots);
  box.appendChild(pool);
}

/* ---- 结局 ---- */
function endGame(){
  S.done = true;
  const pct = S.insight / MAX;
  let rank, title, body;
  if(pct >= .78){
    title = '辩证的同行者';
    body = '你走的时候，天已经亮了。\n\n你带走的不是一堆术语，而是一个动词——扬弃。你知道任何东西都有它撑不住的地方，而那正是它要往前走的地方。\n\n你也不再要求黑格尔给你答案。你明白了他能给的最好的东西，是让你看清自己站在圆上的哪一点：来处可辨，去处未定。\n\n「下次来，」他在你身后说，「带点新的矛盾。」';
  } else if(pct >= .5){
    title = '门口的学徒';
    body = '你听懂了大半，也放过了一些。\n\n你知道正—反—合不是三步走，知道扬弃里藏着「保存」；但你还没完全习惯那种看法——凡是现成的东西，都要问一句：它靠什么才成立？\n\n黑格尔吹熄了蜡烛。「回去之后，别急着用这些词。先去用它们看你自己的生活。词是别人的，看法得是你自己的。」';
  } else {
    title = '深夜的访客';
    body = '你来得晚，走得也早。\n\n不过你至少记住了那只猫头鹰：智慧黄昏才起飞，理解总是迟到一步。\n\n「这不算失败，」黑格尔在门口说，「大多数人一辈子都没进过这间屋子。下次来，我们从头开始——从『有』这个字开始，它比你想的空得多。」';
  }
  let rank2 = '理解度 ' + Math.round(pct * 100) + '%　·　概念卡 ' + S.cards.size + '/' + Object.keys(CARDS).length;
  $('#endTitle').textContent = title;
  $('#endRank').textContent = rank2;
  $('#endBody').innerHTML = body.replace(/\n/g, '<br>');
  $('#endScore').textContent = '—— 本次夜谈收获 ——';
  const cm = $('#endCards');
  cm.innerHTML = '';
  S.cards.forEach(id => {
    const d = document.createElement('span');
    d.className = 'cm'; d.textContent = CARDS[id].t;
    cm.appendChild(d);
  });
  $('#endScreen').classList.remove('hide');
  $('#endScreen').scrollTop = 0;
}

/* ---- 交互 ---- */
$('#dialogue').addEventListener('click', (e) => {
  if(e.target.closest('.opt,.slot,.tile')) return;
  if(finishTyping()) return;
  if(pendingNext){ const n = pendingNext; pendingNext = null; $('#hint').style.opacity = 0; go(n); }
});

$('#startBtn').onclick = () => {
  $('#title').classList.add('hide');
  $('#cardCount').textContent = S.cards.size;
  renderCards(); updateBar();
  setTimeout(() => go('door'), 380);
};

$('#cardBtn').onclick = (e) => { e.stopPropagation(); $('#drawer').classList.add('on'); };
$('#closeDrawer').onclick = () => $('#drawer').classList.remove('on');

$('#againBtn').onclick = () => {
  S.insight = 0; S.cards = new Set(['bianzheng']); S.done = false;
  $('#echo').classList.remove('on'); $('#echo').textContent = '';
  $('#cardCount').textContent = S.cards.size;
  renderCards(); updateBar();
  $('#endScreen').classList.add('hide');
  $('#chapter').textContent = '序';
  go('door');
};

renderCards();

</script>
</body>
</html>
